<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GYM">
    <meta name="theme-color" content="#000000">
    <title>GYM Tracker</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23000' width='180' height='180'/><text x='90' y='120' font-size='100' font-weight='900' fill='%2300ff00' text-anchor='middle' font-family='system-ui'>GYM</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23000' width='180' height='180'/><text x='90' y='120' font-size='100' font-weight='900' fill='%2300ff00' text-anchor='middle' font-family='system-ui'>GYM</text></svg>">

    <!-- Manifest for PWA -->
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22GYM%20Tracker%22,%22short_name%22:%22GYM%22,%22start_url%22:%22/%22,%22display%22:%22fullscreen%22,%22background_color%22:%22%23000%22,%22theme_color%22:%22%2300ff00%22,%22icons%22:[{%22src%22:%22data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20192%20192%27%3E%3Crect%20fill=%27%23000%27%20width=%27192%27%20height=%27192%27/%3E%3Ctext%20x=%2796%27%20y=%27140%27%20font-size=%27120%27%20font-weight=%27900%27%20fill=%27%2300ff00%27%20text-anchor=%27middle%27%20font-family=%27system-ui%27%3EGYM%3C/text%3E%3C/svg%3E%22,%22sizes%22:%22192x192%22,%22type%22:%22image/svg+xml%22}]}">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        html, body, #root {
            width: 100%;
            height: 100%;
        }

        input, button {
            font-family: inherit;
        }

        input:focus {
            outline: none;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @supports (padding: max(0px)) {
            body {
                padding-bottom: max(0px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // SVG Icons
        const HomeIcon = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        );

        const PlusIcon = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        );

        const TrendingUpIcon = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="23 6 13.5 15.5 8.5 10.5 1 17"></polyline>
                <polyline points="17 6 23 6 23 12"></polyline>
            </svg>
        );

        const TrashIcon = () => (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
        );

        const GymTracker = () => {
            const [workouts, setWorkouts] = useState([]);
            const [activeTab, setActiveTab] = useState('home');
            const [formData, setFormData] = useState({ name: '', sets: '', reps: '', weight: '' });
            const [todayDate, setTodayDate] = useState(new Date().toISOString().split('T')[0]);

            // Load from localStorage
            useEffect(() => {
                const saved = localStorage.getItem('gymData');
                if (saved) {
                    try {
                        const data = JSON.parse(saved);
                        setWorkouts(data.workouts || []);
                    } catch (e) {
                        console.log('Error loading data');
                    }
                }
            }, []);

            // Save to localStorage
            useEffect(() => {
                localStorage.setItem('gymData', JSON.stringify({ workouts }));
            }, [workouts]);

            const addExercise = () => {
                if (!formData.name || !formData.sets || !formData.reps) return;

                const newExercise = {
                    id: Date.now(),
                    name: formData.name,
                    sets: parseInt(formData.sets),
                    reps: parseInt(formData.reps),
                    weight: formData.weight || 'BW',
                    date: todayDate
                };

                setWorkouts([...workouts, newExercise]);
                setFormData({ name: '', sets: '', reps: '', weight: '' });
            };

            const deleteExercise = (id) => {
                setWorkouts(workouts.filter(w => w.id !== id));
            };

            const getTodayExercises = () => {
                return workouts.filter(w => w.date === todayDate);
            };

            const getExerciseHistory = (name) => {
                return workouts.filter(w => w.name.toLowerCase() === name.toLowerCase()).sort((a, b) => new Date(b.date) - new Date(a.date));
            };

            const getUniquExercises = () => {
                const unique = {};
                workouts.forEach(w => {
                    if (!unique[w.name.toLowerCase()]) {
                        unique[w.name.toLowerCase()] = w.name;
                    }
                });
                return Object.values(unique);
            };

            const getMaxWeight = (exerciseName) => {
                const history = getExerciseHistory(exerciseName);
                if (history.length === 0) return null;
                const weights = history.map(h => h.weight === 'BW' ? 0 : parseFloat(h.weight)).filter(w => !isNaN(w));
                return weights.length > 0 ? Math.max(...weights) : null;
            };

            return (
                <div style={{ background: '#0a0a0a', color: '#fff', minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
                    {/* Header */}
                    <div style={{ background: '#000', padding: '20px', borderBottom: '2px solid #1a1a1a', flexShrink: 0 }}>
                        <h1 style={{ margin: 0, fontSize: '28px', fontWeight: 900, letterSpacing: '-1px' }}>GYM.</h1>
                        <p style={{ margin: '4px 0 0', fontSize: '12px', color: '#666', fontWeight: 500 }}>Track your progress</p>
                    </div>

                    {/* Content */}
                    <div style={{ flex: 1, overflowY: 'auto', paddingBottom: '80px' }}>
                        {/* HOME TAB */}
                        {activeTab === 'home' && (
                            <div style={{ padding: '20px' }}>
                                <div style={{ marginBottom: '24px' }}>
                                    <p style={{ margin: '0 0 12px', fontSize: '12px', color: '#888', fontWeight: 600, textTransform: 'uppercase' }}>Today</p>
                                    <input
                                        type="date"
                                        value={todayDate}
                                        onChange={(e) => setTodayDate(e.target.value)}
                                        style={{
                                            width: '100%',
                                            padding: '12px',
                                            background: '#1a1a1a',
                                            border: '1px solid #2a2a2a',
                                            color: '#fff',
                                            borderRadius: '8px',
                                            fontSize: '14px'
                                        }}
                                    />
                                </div>

                                {getTodayExercises().length === 0 ? (
                                    <div style={{ textAlign: 'center', padding: '40px 20px', color: '#666' }}>
                                        <p style={{ fontSize: '14px', margin: 0 }}>No exercises logged today</p>
                                        <p style={{ fontSize: '12px', color: '#555', marginTop: '8px' }}>Let's get to work! 💪</p>
                                    </div>
                                ) : (
                                    <div style={{ display: 'grid', gap: '12px' }}>
                                        {getTodayExercises().map(ex => (
                                            <div
                                                key={ex.id}
                                                style={{
                                                    background: '#1a1a1a',
                                                    padding: '16px',
                                                    borderRadius: '8px',
                                                    border: '1px solid #2a2a2a',
                                                    display: 'flex',
                                                    justifyContent: 'space-between',
                                                    alignItems: 'center',
                                                    animation: 'slideIn 0.3s ease'
                                                }}
                                            >
                                                <div>
                                                    <p style={{ margin: 0, fontSize: '16px', fontWeight: 700 }}>{ex.name}</p>
                                                    <p style={{ margin: '6px 0 0', fontSize: '13px', color: '#888' }}>
                                                        {ex.sets}×{ex.reps} @ {ex.weight}kg
                                                    </p>
                                                </div>
                                                <button
                                                    onClick={() => deleteExercise(ex.id)}
                                                    style={{
                                                        background: '#ff3333',
                                                        border: 'none',
                                                        color: '#fff',
                                                        width: '32px',
                                                        height: '32px',
                                                        borderRadius: '6px',
                                                        cursor: 'pointer',
                                                        display: 'flex',
                                                        alignItems: 'center',
                                                        justifyContent: 'center',
                                                        transition: 'all 0.2s'
                                                    }}
                                                    onMouseEnter={(e) => e.target.style.background = '#ff5555'}
                                                    onMouseLeave={(e) => e.target.style.background = '#ff3333'}
                                                >
                                                    <TrashIcon />
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* ADD TAB */}
                        {activeTab === 'add' && (
                            <div style={{ padding: '20px' }}>
                                <p style={{ margin: '0 0 16px', fontSize: '12px', color: '#888', fontWeight: 600, textTransform: 'uppercase' }}>New Exercise</p>
                                <div style={{ display: 'grid', gap: '12px' }}>
                                    <input
                                        type="text"
                                        placeholder="Exercise name (e.g. Bench Press)"
                                        value={formData.name}
                                        onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                                        list="exercises-list"
                                        style={{
                                            padding: '14px',
                                            background: '#1a1a1a',
                                            border: '1px solid #2a2a2a',
                                            color: '#fff',
                                            borderRadius: '8px',
                                            fontSize: '14px'
                                        }}
                                    />
                                    <datalist id="exercises-list">
                                        {getUniquExercises().map(ex => <option key={ex} value={ex} />)}
                                    </datalist>

                                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                                        <input
                                            type="number"
                                            placeholder="Sets"
                                            value={formData.sets}
                                            onChange={(e) => setFormData({ ...formData, sets: e.target.value })}
                                            style={{
                                                padding: '14px',
                                                background: '#1a1a1a',
                                                border: '1px solid #2a2a2a',
                                                color: '#fff',
                                                borderRadius: '8px',
                                                fontSize: '14px'
                                            }}
                                        />
                                        <input
                                            type="number"
                                            placeholder="Reps"
                                            value={formData.reps}
                                            onChange={(e) => setFormData({ ...formData, reps: e.target.value })}
                                            style={{
                                                padding: '14px',
                                                background: '#1a1a1a',
                                                border: '1px solid #2a2a2a',
                                                color: '#fff',
                                                borderRadius: '8px',
                                                fontSize: '14px'
                                            }}
                                        />
                                    </div>

                                    <input
                                        type="number"
                                        placeholder="Weight (kg) or leave empty for BW"
                                        value={formData.weight}
                                        onChange={(e) => setFormData({ ...formData, weight: e.target.value })}
                                        style={{
                                            padding: '14px',
                                            background: '#1a1a1a',
                                            border: '1px solid #2a2a2a',
                                            color: '#fff',
                                            borderRadius: '8px',
                                            fontSize: '14px'
                                        }}
                                    />

                                    <button
                                        onClick={addExercise}
                                        style={{
                                            padding: '14px',
                                            background: '#00ff00',
                                            border: 'none',
                                            color: '#000',
                                            borderRadius: '8px',
                                            fontSize: '16px',
                                            fontWeight: 700,
                                            cursor: 'pointer',
                                            marginTop: '8px',
                                            transition: 'all 0.2s',
                                            boxShadow: '0 0 20px rgba(0,255,0,0.3)'
                                        }}
                                        onMouseEnter={(e) => e.target.style.boxShadow = '0 0 30px rgba(0,255,0,0.5)'}
                                        onMouseLeave={(e) => e.target.style.boxShadow = '0 0 20px rgba(0,255,0,0.3)'}
                                    >
                                        ADD EXERCISE
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* PROGRESS TAB */}
                        {activeTab === 'progress' && (
                            <div style={{ padding: '20px' }}>
                                <p style={{ margin: '0 0 16px', fontSize: '12px', color: '#888', fontWeight: 600, textTransform: 'uppercase' }}>Your Exercises</p>
                                {getUniquExercises().length === 0 ? (
                                    <div style={{ textAlign: 'center', padding: '40px 20px', color: '#666' }}>
                                        <p style={{ fontSize: '14px', margin: 0 }}>No exercises yet</p>
                                    </div>
                                ) : (
                                    <div style={{ display: 'grid', gap: '12px' }}>
                                        {getUniquExercises().map(exName => {
                                            const history = getExerciseHistory(exName);
                                            const maxWeight = getMaxWeight(exName);
                                            return (
                                                <div
                                                    key={exName}
                                                    style={{
                                                        background: '#1a1a1a',
                                                        padding: '16px',
                                                        borderRadius: '8px',
                                                        border: '1px solid #2a2a2a'
                                                    }}
                                                >
                                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'start', marginBottom: '12px' }}>
                                                        <div>
                                                            <p style={{ margin: 0, fontSize: '16px', fontWeight: 700 }}>{exName}</p>
                                                            <p style={{ margin: '4px 0 0', fontSize: '12px', color: '#888' }}>{history.length} sessions</p>
                                                        </div>
                                                        {maxWeight && (
                                                            <div style={{ background: '#00ff00', color: '#000', padding: '4px 8px', borderRadius: '4px', fontSize: '12px', fontWeight: 700 }}>
                                                                MAX {maxWeight}kg
                                                            </div>
                                                        )}
                                                    </div>
                                                    <div style={{ fontSize: '12px', color: '#666' }}>
                                                        {history.slice(0, 3).map((h, i) => (
                                                            <p key={i} style={{ margin: '4px 0' }}>
                                                                {h.date}: {h.sets}×{h.reps} @ {h.weight}kg
                                                            </p>
                                                        ))}
                                                        {history.length > 3 && <p style={{ margin: '4px 0', color: '#555' }}>+{history.length - 3} more</p>}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {/* Bottom Navigation */}
                    <div
                        style={{
                            position: 'fixed',
                            bottom: 0,
                            left: 0,
                            right: 0,
                            background: '#000',
                            borderTop: '2px solid #1a1a1a',
                            display: 'grid',
                            gridTemplateColumns: '1fr 1fr 1fr',
                            gap: 0,
                            padding: '8px 0',
                            paddingBottom: 'max(8px, env(safe-area-inset-bottom))'
                        }}
                    >
                        {[
                            { id: 'home', icon: HomeIcon, label: 'Home' },
                            { id: 'add', icon: PlusIcon, label: 'Add' },
                            { id: 'progress', icon: TrendingUpIcon, label: 'Progress' }
                        ].map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                style={{
                                    background: activeTab === tab.id ? '#1a1a1a' : 'transparent',
                                    border: 'none',
                                    color: activeTab === tab.id ? '#00ff00' : '#666',
                                    cursor: 'pointer',
                                    padding: '12px 8px',
                                    display: 'flex',
                                    flexDirection: 'column',
                                    alignItems: 'center',
                                    gap: '4px',
                                    fontSize: '11px',
                                    fontWeight: 600,
                                    transition: 'all 0.2s'
                                }}
                            >
                                <tab.icon />
                                {tab.label}
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GymTracker />);
    </script>
</body>
</html>
