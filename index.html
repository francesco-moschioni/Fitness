<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GYM">
    <meta name="theme-color" content="#000000">
    <title>GYM Tracker</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23000' width='180' height='180'/><text x='90' y='120' font-size='100' font-weight='900' fill='%2300ff00' text-anchor='middle' font-family='system-ui'>GYM</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23000' width='180' height='180'/><text x='90' y='120' font-size='100' font-weight='900' fill='%2300ff00' text-anchor='middle' font-family='system-ui'>GYM</text></svg>">
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22GYM%20Tracker%22,%22short_name%22:%22GYM%22,%22start_url%22:%22/%22,%22display%22:%22fullscreen%22,%22background_color%22:%22%23000%22,%22theme_color%22:%22%2300ff00%22,%22icons%22:[{%22src%22:%22data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20192%20192%27%3E%3Crect%20fill=%27%23000%27%20width=%27192%27%20height=%27192%27/%3E%3Ctext%20x=%2796%27%20y=%27140%27%20font-size=%27120%27%20font-weight=%27900%27%20fill=%27%2300ff00%27%20text-anchor=%27middle%27%20font-family=%27system-ui%27%3EGYM%3C/text%3E%3C/svg%3E%22,%22sizes%22:%22192x192%22,%22type%22:%22image/svg+xml%22}]}">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { height: 100%; overflow: hidden; }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            position: fixed;
            width: 100%;
        }

        #root { height: 100%; overflow: hidden; display: flex; flex-direction: column; }

        input, button, select { font-family: inherit; }
        input:focus, select:focus, button:focus { outline: none; }
        select { -webkit-appearance: none; appearance: none; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const SCHEDULES_URL = 'https://raw.githubusercontent.com/francesco-moschioni/Fitness/main/schedules.json';

        const ARROW = `url("data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#555"/></svg>')}")`;

        const base = {
            width: '100%', padding: '13px 14px',
            background: '#161616', border: '1px solid #252525',
            color: '#fff', borderRadius: '10px', fontSize: '15px'
        };

        const inputStyle = base;
        const selectStyle = {
            ...base,
            paddingRight: '38px',
            backgroundImage: ARROW,
            backgroundRepeat: 'no-repeat',
            backgroundPosition: 'right 12px center',
            cursor: 'pointer'
        };

        const Label = ({ text }) => (
            <p style={{ margin: '0 0 6px', fontSize: '11px', color: '#666', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.6px' }}>{text}</p>
        );

        const HomeIcon  = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
        const PlusIcon  = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        const ChartIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 17"/><polyline points="17 6 23 6 23 12"/></svg>;
        const TrashIcon = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;

        const TABS = [
            { id: 'home',     icon: HomeIcon,  label: 'Home' },
            { id: 'add',      icon: PlusIcon,  label: 'Add' },
            { id: 'progress', icon: ChartIcon, label: 'Progress' }
        ];

        const GymTracker = () => {
            const [workouts,     setWorkouts]     = useState([]);
            const [activeTab,    setActiveTab]    = useState('home');
            const [form,         setForm]         = useState({ name: '', sets: '', reps: '', weight: '' });
            const [today,        setToday]        = useState(new Date().toISOString().split('T')[0]);
            const [schedules,    setSchedules]    = useState([]);
            const [selSchedule,  setSelSchedule]  = useState('');
            const [loadingSched, setLoadingSched] = useState(true);
            const [schedError,   setSchedError]   = useState(null);

            useEffect(() => {
                try {
                    const d = JSON.parse(localStorage.getItem('gymData') || '{}');
                    setWorkouts(d.workouts || []);
                } catch (e) {}
            }, []);

            useEffect(() => {
                localStorage.setItem('gymData', JSON.stringify({ workouts }));
            }, [workouts]);

            useEffect(() => {
                fetch(`${SCHEDULES_URL}?_=${Date.now()}`)
                    .then(r => { if (!r.ok) throw r; return r.json(); })
                    .then(d  => { setSchedules(d); setLoadingSched(false); })
                    .catch(() => { setSchedError('Impossibile caricare le schede dal repo'); setLoadingSched(false); });
            }, []);

            const currentSched = useMemo(() => schedules.find(s => s.name === selSchedule), [schedules, selSchedule]);

            const pickExercise = (name) => {
                const ex = currentSched?.exercises.find(e => e.name === name);
                setForm({ name, sets: ex?.sets?.toString() ?? '', reps: ex?.reps?.toString() ?? '', weight: ex?.weight?.toString() ?? '' });
            };

            const addExercise = () => {
                if (!form.name || !form.sets || !form.reps) return;
                setWorkouts(p => [...p, {
                    id: Date.now(), name: form.name,
                    sets: +form.sets, reps: +form.reps,
                    weight: form.weight || 'BW', date: today
                }]);
                setForm(f => ({ name: '', sets: f.sets, reps: f.reps, weight: '' }));
            };

            const todayEx  = useMemo(() => workouts.filter(w => w.date === today), [workouts, today]);
            const uniqueEx = useMemo(() => {
                const seen = new Set();
                return workouts.reduce((acc, w) => {
                    const k = w.name.toLowerCase();
                    if (!seen.has(k)) { seen.add(k); acc.push(w.name); }
                    return acc;
                }, []);
            }, [workouts]);

            const historyOf   = (name) => workouts.filter(w => w.name.toLowerCase() === name.toLowerCase()).sort((a, b) => b.date.localeCompare(a.date));
            const maxWeightOf = (name) => {
                const ws = historyOf(name).map(h => h.weight === 'BW' ? 0 : +h.weight).filter(n => !isNaN(n));
                return ws.length ? Math.max(...ws) : null;
            };

            const canAdd = form.name && form.sets && form.reps;

            return (
                <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>

                    <div style={{ background: '#000', padding: '14px 20px 12px', borderBottom: '1px solid #1a1a1a', flexShrink: 0, zIndex: 10 }}>
                        <div style={{ display: 'flex', alignItems: 'baseline', gap: '8px' }}>
                            <h1 style={{ margin: 0, fontSize: '24px', fontWeight: 900, letterSpacing: '-1px' }}>GYM.</h1>
                            {selSchedule && activeTab === 'add' && (
                                <span style={{ fontSize: '13px', color: '#00ff00', fontWeight: 600 }}>{selSchedule}</span>
                            )}
                        </div>
                        <p style={{ margin: '2px 0 0', fontSize: '11px', color: '#444' }}>Track your progress</p>
                    </div>

                    <div style={{ flex: 1, minHeight: 0, overflowY: 'auto', WebkitOverflowScrolling: 'touch', paddingBottom: 'calc(65px + env(safe-area-inset-bottom))' }}>

                        {activeTab === 'home' && (
                            <div style={{ padding: '16px', display: 'flex', flexDirection: 'column', gap: '16px' }}>
                                <div>
                                    <Label text="Data allenamento" />
                                    <input type="date" value={today} onChange={e => setToday(e.target.value)} style={inputStyle} />
                                </div>
                                {todayEx.length === 0 ? (
                                    <div style={{ textAlign: 'center', padding: '60px 0', color: '#444' }}>
                                        <p>Nessun esercizio per oggi</p>
                                        <p style={{ fontSize: '12px', marginTop: '6px', color: '#333' }}>Vai su Add per iniziare 💪</p>
                                    </div>
                                ) : (
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                                        {todayEx.map(ex => (
                                            <div key={ex.id} style={{ background: '#161616', padding: '13px 14px', borderRadius: '10px', border: '1px solid #222', display: 'flex', justifyContent: 'space-between', alignItems: 'center', animation: 'slideIn 0.2s ease' }}>
                                                <div style={{ minWidth: 0, flex: 1 }}>
                                                    <p style={{ margin: 0, fontSize: '15px', fontWeight: 700, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{ex.name}</p>
                                                    <p style={{ margin: '3px 0 0', fontSize: '13px', color: '#777' }}>{ex.sets}×{ex.reps} @ {ex.weight}{ex.weight !== 'BW' ? ' kg' : ''}</p>
                                                </div>
                                                <button onClick={() => setWorkouts(p => p.filter(w => w.id !== ex.id))} style={{ flexShrink: 0, marginLeft: '12px', background: '#1e0a0a', border: '1px solid #3a1515', color: '#cc3333', width: '34px', height: '34px', borderRadius: '8px', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                                                    <TrashIcon />
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'add' && (
                            <div style={{ padding: '16px', display: 'flex', flexDirection: 'column', gap: '14px' }}>
                                <div>
                                    <Label text="Scheda" />
                                    {loadingSched ? (
                                        <div style={{ ...base, color: '#444' }}>Caricamento schede...</div>
                                    ) : schedError ? (
                                        <div style={{ ...base, color: '#cc4444', fontSize: '13px' }}>{schedError}</div>
                                    ) : (
                                        <select value={selSchedule} onChange={e => { setSelSchedule(e.target.value); setForm({ name: '', sets: '', reps: '', weight: '' }); }} style={selectStyle}>
                                            <option value="">— Inserimento libero —</option>
                                            {schedules.map(s => <option key={s.name} value={s.name}>{s.name}</option>)}
                                        </select>
                                    )}
                                </div>

                                <div>
                                    <Label text="Esercizio" />
                                    {currentSched ? (
                                        <select value={form.name} onChange={e => pickExercise(e.target.value)} style={selectStyle}>
                                            <option value="">— Seleziona esercizio —</option>
                                            {currentSched.exercises.map(ex => <option key={ex.name} value={ex.name}>{ex.name}</option>)}
                                        </select>
                                    ) : (
                                        <>
                                            <input type="text" placeholder="es. Panca Piana" value={form.name} list="ex-list" onChange={e => setForm(f => ({ ...f, name: e.target.value }))} style={inputStyle} />
                                            <datalist id="ex-list">{uniqueEx.map(n => <option key={n} value={n} />)}</datalist>
                                        </>
                                    )}
                                </div>

                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                                    <div>
                                        <Label text="Serie" />
                                        <input type="number" inputMode="numeric" placeholder="4" value={form.sets} onChange={e => setForm(f => ({ ...f, sets: e.target.value }))} style={inputStyle} />
                                    </div>
                                    <div>
                                        <Label text="Reps" />
                                        <input type="number" inputMode="numeric" placeholder="8" value={form.reps} onChange={e => setForm(f => ({ ...f, reps: e.target.value }))} style={inputStyle} />
                                    </div>
                                </div>

                                <div>
                                    <Label text="Peso (kg) — vuoto = corpo libero" />
                                    <input type="number" inputMode="decimal" placeholder="80" value={form.weight} onChange={e => setForm(f => ({ ...f, weight: e.target.value }))} style={inputStyle} />
                                </div>

                                <button onClick={addExercise} style={{ padding: '15px', background: canAdd ? '#00ff00' : '#0d1a0d', border: `1px solid ${canAdd ? '#00ff00' : '#1a2a1a'}`, color: canAdd ? '#000' : '#2a4a2a', borderRadius: '10px', fontSize: '14px', fontWeight: 800, cursor: canAdd ? 'pointer' : 'default', letterSpacing: '0.5px', transition: 'all 0.15s', boxShadow: canAdd ? '0 0 20px rgba(0,255,0,0.2)' : 'none' }}>
                                    AGGIUNGI ESERCIZIO
                                </button>
                            </div>
                        )}

                        {activeTab === 'progress' && (
                            <div style={{ padding: '16px' }}>
                                <Label text="Storico esercizi" />
                                {uniqueEx.length === 0 ? (
                                    <div style={{ textAlign: 'center', padding: '60px 0', color: '#444', fontSize: '14px' }}>Nessun esercizio ancora</div>
                                ) : (
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', marginTop: '12px' }}>
                                        {uniqueEx.map(name => {
                                            const hist = historyOf(name);
                                            const maxW = maxWeightOf(name);
                                            return (
                                                <div key={name} style={{ background: '#161616', padding: '14px', borderRadius: '10px', border: '1px solid #222' }}>
                                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>
                                                        <div>
                                                            <p style={{ margin: 0, fontSize: '15px', fontWeight: 700 }}>{name}</p>
                                                            <p style={{ margin: '2px 0 0', fontSize: '11px', color: '#555' }}>{hist.length} session{hist.length !== 1 ? 'i' : 'e'}</p>
                                                        </div>
                                                        {maxW > 0 && <span style={{ background: '#00ff00', color: '#000', padding: '2px 8px', borderRadius: '5px', fontSize: '11px', fontWeight: 800 }}>MAX {maxW} kg</span>}
                                                    </div>
                                                    <div style={{ borderTop: '1px solid #1e1e1e', paddingTop: '8px', display: 'flex', flexDirection: 'column', gap: '3px' }}>
                                                        {hist.slice(0, 3).map((h, i) => (
                                                            <p key={i} style={{ margin: 0, fontSize: '12px', color: '#555' }}>{h.date}&nbsp;&nbsp;{h.sets}×{h.reps} @ {h.weight}{h.weight !== 'BW' ? ' kg' : ''}</p>
                                                        ))}
                                                        {hist.length > 3 && <p style={{ margin: 0, fontSize: '11px', color: '#444' }}>+{hist.length - 3} altre</p>}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    <div style={{ position: 'fixed', bottom: 0, left: 0, right: 0, background: '#000', borderTop: '1px solid #1a1a1a', display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', zIndex: 100, paddingBottom: 'env(safe-area-inset-bottom)' }}>
                        {TABS.map(t => (
                            <button key={t.id} onClick={() => setActiveTab(t.id)} style={{ background: 'transparent', border: 'none', color: activeTab === t.id ? '#00ff00' : '#3a3a3a', cursor: 'pointer', padding: '12px 0 10px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '3px', fontSize: '10px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.5px', transition: 'color 0.15s' }}>
                                <t.icon />
                                {t.label}
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<GymTracker />);
    </script>
</body>
</html>
